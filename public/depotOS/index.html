<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="referrer" content="no-referrer">
<title>TARS Depot OS</title>
<link rel="icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">

<style>
/* ==========================================================================
   Access gate. Tokens are namespaced --g-* so that the decrypted document's
   own token block cannot collide with this one during the handover.
   ========================================================================== */
:root {
  --g-ink:   #12171F;
  --g-ink-2: #29313D;
  --g-ink-3: #5C6673;
  --g-rule:  #DCE0E7;
  --g-paper: #F7F8FA;
  --g-card:  #FFFFFF;
  --g-accent:      #1B8FA8;
  --g-accent-deep: #0E5A6D;
  --g-accent-wash: rgba(27, 143, 168, 0.10);
  --g-on-accent:   #FFFFFF;
  --g-bad:      #B3261E;
  --g-bad-wash: rgba(179, 38, 30, 0.10);
  --g-shadow: 0 2px 18px rgba(18, 23, 31, 0.08);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --g-ink:   #E9EDF2;
    --g-ink-2: #C2CAD4;
    --g-ink-3: #949DA9;
    --g-rule:  #2A313C;
    --g-paper: #0F1319;
    --g-card:  #171C24;
    --g-accent:      #3EB2CB;
    --g-accent-deep: #6BD2E6;
    --g-accent-wash: rgba(62, 178, 203, 0.14);
    --g-on-accent:   #0F1319;
    --g-bad:      #F2A6A0;
    --g-bad-wash: rgba(242, 166, 160, 0.12);
    --g-shadow: 0 2px 18px rgba(0, 0, 0, 0.5);
  }
}
:root[data-theme="dark"] {
  --g-ink:   #E9EDF2;
  --g-ink-2: #C2CAD4;
  --g-ink-3: #949DA9;
  --g-rule:  #2A313C;
  --g-paper: #0F1319;
  --g-card:  #171C24;
  --g-accent:      #3EB2CB;
  --g-accent-deep: #6BD2E6;
  --g-accent-wash: rgba(62, 178, 203, 0.14);
  --g-on-accent:   #0F1319;
  --g-bad:      #F2A6A0;
  --g-bad-wash: rgba(242, 166, 160, 0.12);
  --g-shadow: 0 2px 18px rgba(0, 0, 0, 0.5);
}

* { box-sizing: border-box; }

html, body { height: 100%; }
body {
  margin: 0;
  background: var(--g-paper);
  color: var(--g-ink);
  font-family: "Public Sans", system-ui, -apple-system, sans-serif;
  -webkit-font-smoothing: antialiased;
}

.gate {
  min-height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 32px 20px;
}

.gatecard {
  width: 100%;
  max-width: 430px;
  background: var(--g-card);
  border: 1px solid var(--g-rule);
  border-radius: 5px;
  box-shadow: var(--g-shadow);
  padding: 30px 30px 26px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.gatemark {
  font-family: "JetBrains Mono", ui-monospace, Menlo, monospace;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--g-ink-3);
  display: flex;
  align-items: center;
  gap: 12px;
}
.gatemark::after { content: ""; flex: 1; height: 1px; background: var(--g-rule); }

.gatecard h1 {
  font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
  font-weight: 800;
  font-size: 28px;
  line-height: 1.08;
  letter-spacing: -0.028em;
  margin: 0;
  text-wrap: balance;
}

.gatecard p.blurb {
  margin: 0;
  font-size: 14.5px;
  line-height: 1.55;
  color: var(--g-ink-3);
}

form { display: flex; flex-direction: column; gap: 10px; }

label {
  font-family: "JetBrains Mono", ui-monospace, Menlo, monospace;
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 0.11em;
  text-transform: uppercase;
  color: var(--g-ink-3);
}

input[type="password"] {
  font-family: "JetBrains Mono", ui-monospace, Menlo, monospace;
  font-size: 15px;
  letter-spacing: 0.06em;
  padding: 11px 13px;
  border: 1px solid var(--g-rule);
  border-radius: 4px;
  background: var(--g-paper);
  color: var(--g-ink);
  width: 100%;
}
input[type="password"]:focus {
  outline: 2px solid var(--g-accent);
  outline-offset: 1px;
  border-color: transparent;
}

button {
  font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
  font-weight: 700;
  font-size: 15px;
  letter-spacing: 0.01em;
  padding: 11px 16px;
  border: none;
  border-radius: 4px;
  background: var(--g-accent-deep);
  color: var(--g-on-accent);
  cursor: pointer;
  width: 100%;
}
button:hover:not(:disabled) { filter: brightness(1.08); }
button:disabled { opacity: 0.6; cursor: progress; }
button:focus-visible { outline: 2px solid var(--g-accent); outline-offset: 2px; }

.msg {
  font-family: "JetBrains Mono", ui-monospace, Menlo, monospace;
  font-size: 12px;
  line-height: 1.5;
  min-height: 1.5em;
  margin: 0;
  color: var(--g-ink-3);
}
.msg.bad {
  color: var(--g-bad);
  background: var(--g-bad-wash);
  border-radius: 3px;
  padding: 7px 9px;
}

.foot {
  font-family: "JetBrains Mono", ui-monospace, Menlo, monospace;
  font-size: 10.5px;
  line-height: 1.6;
  color: var(--g-ink-3);
  border-top: 1px solid var(--g-rule);
  padding-top: 13px;
  margin: 0;
}
</style>
</head>
<body>

<div class="gate" id="gate">
  <div class="gatecard">
    <div class="gatemark">TARS</div>
    <h1>Depot Operating System</h1>
    <p class="blurb">
      This briefing is shared privately. Enter the passphrase you were given to open it.
    </p>

    <form id="f" autocomplete="off">
      <label for="p">Passphrase</label>
      <input id="p" type="password" autocomplete="current-password" autofocus
             spellcheck="false" aria-describedby="m">
      <button id="b" type="submit">Open the briefing</button>
    </form>

    <p class="msg" id="m" role="status" aria-live="polite"></p>

    <p class="foot">
      Not sure of the passphrase? Reply to whoever sent you this link.
      <noscript><br><strong>This page needs JavaScript to open.</strong></noscript>
    </p>
  </div>
</div>

  var KEY = "tars-depotos-pass";

  var form = document.getElementById("f");
  var input = document.getElementById("p");
  var btn = document.getElementById("b");
  var msg = document.getElementById("m");

  function b64(s) {
    var bin = atob(s), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  function say(text, bad) {
    msg.textContent = text;
    msg.className = bad ? "msg bad" : "msg";
  }

  if (!window.crypto || !window.crypto.subtle) {
    say("This browser cannot open the briefing. Try Chrome, Safari, Edge or Firefox over https.", true);
    btn.disabled = true;
    return;
  }

  async function unlock(pass, quiet) {
    btn.disabled = true;
    if (!quiet) say("Opening…", false);
    try {
      var base = await crypto.subtle.importKey(
        "raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
      var key = await crypto.subtle.deriveKey(
        { name: "PBKDF2", salt: b64(SALT), iterations: ITER, hash: "SHA-256" },
        base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
      var plain = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: b64(IV) }, key, b64(CT));
      var doc = JSON.parse(new TextDecoder().decode(plain));

      // Hand over: the gate is removed, then the document's own styles and
      // markup are attached. Order matters, the document restyles body.
      var gate = document.getElementById("gate");
      if (gate) gate.remove();
      var style = document.createElement("style");
      style.textContent = doc.css;
      document.head.appendChild(style);
      document.body.insertAdjacentHTML("beforeend", doc.html);
      try { sessionStorage.setItem(KEY, pass); } catch (e) {}
      window.scrollTo(0, 0);
    } catch (e) {
      try { sessionStorage.removeItem(KEY); } catch (e2) {}
      btn.disabled = false;
      if (quiet) { say("", false); return; }
      say("That passphrase did not open the briefing. Check for a stray space and try again.", true);
      input.select();
    }
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var v = input.value.trim();
    if (!v) { say("Enter the passphrase to continue.", true); return; }
    unlock(v, false);
  });

  // Reopen without retyping for the rest of this tab session.
  var saved = null;
  try { saved = sessionStorage.getItem(KEY); } catch (e) {}
  if (saved) unlock(saved, true);
